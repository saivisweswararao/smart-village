<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report a village problem | Penubaka</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script defer src="js/language.js"></script><script defer src="js/issues.js"></script></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-icon">గ్రా</span><span><strong>మన పెనుబాక</strong><small>Penubaka Smart Village</small></span></a><button id="language-toggle" class="language-toggle" type="button">English</button></header><main class="page-wrap"><a class="nav-back" href="index.html">← Home / హోమ్</a><h1 data-en="Report a village problem" data-te="గ్రామ సమస్యను తెలియజేయండి">గ్రామ సమస్యను తెలియజేయండి</h1><p class="muted">Do not include sensitive personal information. Reports are private to authorized administrators. / వ్యక్తిగత రహస్య సమాచారాన్ని నమోదు చేయవద్దు.</p><form id="issue-form" class="panel"><div class="form-grid"><div class="field"><label for="category">Category / వర్గం</label><select id="category" name="category" required><option value="road">Road / రోడ్డు</option><option value="drainage">Drainage / డ్రైనేజీ</option><option value="garbage">Garbage / చెత్త</option><option value="water">Water / నీరు</option><option value="streetlight">Streetlight / వీధి దీపం</option><option value="electricity">Electricity / విద్యుత్</option><option value="other">Other / ఇతర</option></select></div><div class="field"><label for="area">Area (optional) / ప్రాంతం</label><input id="area" name="area" maxlength="200"></div></div><div class="field"><label for="description">Describe the problem / సమస్య వివరాలు</label><textarea id="description" name="description" minlength="10" maxlength="2000" required rows="5"></textarea></div><button class="button" type="submit">Submit report / పంపండి</button><p id="issue-message" class="status-message" role="status"></p></form></main><footer class="site-footer">Penubaka Smart Village</footer></body></html>
